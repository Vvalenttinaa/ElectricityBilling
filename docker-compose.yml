services:

  postgres:
    image: postgres:17
    container_name: electricity-postgres

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10


  backend:
    container_name: electricity-api

    build:
      context: .
      dockerfile: ElectricityBilling.API/Dockerfile

    ports:
      - "5235:8080"

    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080

      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}

      EmailSettings__Password: ${EMAIL_PASSWORD}

      Jwt__Key: ${JWT_KEY}

    depends_on:
      postgres:
        condition: service_healthy


  frontend:
    container_name: electricity-ui

    build:
      context: ./electricity-billing-ui

    ports:
      - "4200:4200"

    depends_on:
      - backend


volumes:
  postgres_data: